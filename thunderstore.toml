[config]
schemaVersion = "0.0.1"

[package]
namespace = "praetoris"
name = "PraetorisClient"
versionNumber = "0.1.104"
description = "Client-side Praetoris tools for Discord linking, creative server bridges, RPC tracing, socket metrics, and RPC probes."
websiteUrl = "https://discord.gg/3aaru2VyHJ"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
RandyKnapp-EpicLoot = "0.15.1"
ValheimModding-Jotunn = "2.30.2"
ValheimModding-JsonDotNET = "13.0.4"
MidnightMods-StarLevelSystem = "1.26.3"
ValheimModding-YamlDotNet = "16.3.1"

[build]
icon = "./Assets/ServerGuide/praetoris.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/PraetorisClient.dll"
target = "./PraetorisClient.dll"

[[build.copy]]
source = "./bin/Release/ValheimEndgame.dll"
target = "./ValheimEndgame.dll"

[[build.copy]]
source = "./bin/Release/ValheimEndgame.LICENSE"
target = "./LICENSE.ValheimEndgame"

[[build.copy]]
source = "./bin/Release/ValheimEndgame-licenses"
target = "./licenses"

[[build.copy]]
source = "./bin/Release/ValheimEndgame-config"
target = "./config/EpicLoot/patches"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./THIRD_PARTY_NOTICES.md"
target = "./THIRD_PARTY_NOTICES.md"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]
